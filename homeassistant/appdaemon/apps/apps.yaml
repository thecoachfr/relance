# À ajouter dans /addon_configs/a0d7b954_appdaemon/apps/apps.yaml
relance_vigie:
  module: relance_vigie
  class: RelanceVigie
  # Entité créée par l'intégration Google Tasks pour la liste « Mes tâches » (à confirmer après ajout).
  todo_entity: todo.mes_taches
  bundle_id: fr.alexandrefau.relance
  team_id: GD6W292ZXP
  # Key ID de la clé APNs (10 caractères), et le fichier .p8 copié à côté des apps.
  key_id: XXXXXXXXXX
  key_path: /config/apps/AuthKey_relance.p8
  refresh_seconds: 60
  # Routine Claude « Relance · tri » lancée à chaque nouvelle tâche. Le jeton (déclencheur API de la routine,
  # créé sur claude.ai) se met dans /config/relance_routine_token, jamais dans ce fichier.
  routine_id: trig_01GFD6vBExCUvTYDbx9KePm7
  # Routine « Aiguillage · actions » (P9-D5) pour les actions « preparer » ; jeton dans
  # /config/aiguillage_actions_token, jamais dans ce fichier.
  actions_routine_id: trig_01J1nRgBk4iBC3hBK4vZMLLV
  # Tri par l'API Messages (P9-I) : routine (défaut) | ombre | api. Clé API Console dans /config/anthropic_api_key,
  # consigne dans /config/aiguillage_tri_consigne.md (hors dépôt, modèle dans docs/TRI-CONSIGNE.md).
  tri_mode: api
  tri_budget_mensuel: 30
  # Radios (22/10) : instance de Music Assistant qui cherche les stations sur TuneIn (Paramètres › Appareils).
  # music_assistant_entry: 01K…
  # Favoris (22/10) : adresse du serveur MA (« base_url » de http://<ha>:8095/info) ; jeton dans /config/music_assistant_token.
  # music_assistant_url: http://192.168.1.x:8095
  # Seulement avec une clé d'utilisateur (sk-ant-usr-…) : identifiant de l'espace de travail de la Console.
  # tri_workspace_id: wrkspc_…
  # Activité en direct du Hub iPad (23/10) : adresse locale de HA pour les pochettes relatives (même valeur que
  # l'adresse réglée sur l'iPad) ; jetons dans /config/hub_ipad_activite.json.
  ha_url: http://192.168.1.71:8123
  # Rappels « à la maison » (P9-F2) : présence au salon (Hue MotionAware, helper Template).
  presence_entity: binary_sensor.presence_salon
  # Bermuda (P9-F4) : retour à la maison (iPhone) et pièce d'Alexandre (montre, sinon iPhone).
  domicile_entity: device_tracker.private_ble_iphone
  piece_entity: sensor.piece_d_alexandre
  # Tâches dans Home Assistant (intégration donnees_apps, voir le dépôt ha-donnees-apps) :
  # push à chaque modification de l'espace. N'activer qu'une fois l'app passée sur Home Assistant.
  # ha_espace: aiguillage
  # La liste Google devient la boîte d'entrée des dictées Google Home, vidée dans HA (état dans
  # /config/relance_inbox.json). Ne démarre qu'après la migration de l'app.
  # inbox: true

# Signal → envies (17/10) et mémoire des échanges (P9-J, docs/MEMOIRE-SIGNAL.md). Numéros dans
# /config/aiguillage_signal.json, jamais dans ce fichier ; résumés la nuit par l'API (même clé que le tri).
aiguillage_signal:
  module: aiguillage_signal
  class: AiguillageSignal
  # workspace_id: wrkspc_…
  memoire_budget_mensuel: 5

# Historique des trajets (P9-M, 22/10) : points GPS de l'app Compagnon gardés au-delà de 10 jours, arrêts envoyés
# par Aiguillage (webhook, action « trajets »). Base : /config/aiguillage_trajets.sqlite.
aiguillage_trajets:
  module: aiguillage_trajets
  class: AiguillageTrajets
  entite: device_tracker.iphone_17_lex

# Météo du Hub (24/10/2026) : sensor.hub_meteo pour les trois vues (contrat : homeassistant/HUB-METEO.md).
# Relevés d'apprentissage dans /config/hub_meteo_releves.jsonl (60 jours).
hub_meteo:
  module: hub_meteo
  class: HubMeteo

# Lieu de travail (P9-N, N1, 24/10/2026) : sensor.aiguillage_lieu_travail (bureau / télétravail), contrat :
# homeassistant/LIEU-TRAVAIL.md. Semaine type et exceptions dans donnees_apps (config:lieu_travail), bureau = groupe
# « Travail » de Mes lieux ; constats de position dans /config/aiguillage_lieu_travail.json. Consignes par la
# « Note à moi-même » de Signal (transmises par aiguillage_signal).
aiguillage_lieu_travail:
  module: aiguillage_lieu_travail
  class: AiguillageLieuTravail
  entite: device_tracker.iphone_17_lex

# Courrier (P9-N, N3, 24/10/2026) : tri de la boîte perso alexandre.fau@gmail.com façon Dove → sensor.aiguillage_courrier
# (contrat : homeassistant/COURRIER.md). Lecture seule de Gmail (aucun envoi, aucune suppression, aucun archivage).
# Autorisation Google dans /config/aiguillage_courrier_google.json (écrite par homeassistant/scripts/courrier_autoriser.py,
# jamais dans ce fichier ; sans elle, l'app attend et réessaie toutes les 10 min). Base : /config/aiguillage_courrier.sqlite
# (90 jours) ; état (historyId, coût du mois) : /config/aiguillage_courrier_etat.json ; bilan du soir (21 h) :
# /config/aiguillage_courrier_bilan.md. Tri IA par Claude Haiku 5.5, même clé que le tri (/config/anthropic_api_key).
aiguillage_courrier:
  module: aiguillage_courrier
  class: AiguillageCourrier
  # ombre : tout est calculé et gardé, aucune notification, rien écrit dans Gmail ni dans donnees_apps (seul mode de N3).
  mode: ombre
  courrier_budget_mensuel: 15
  refresh_seconds: 120
  # autorisation_file: /config/aiguillage_courrier_google.json
  # workspace_id: wrkspc_…
