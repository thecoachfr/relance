name: Relance
options:
  bundleIdPrefix: fr.alexandrefau
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
    macOS: "15.0"
  developmentLanguage: fr
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    DEVELOPMENT_TEAM: GD6W292ZXP
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Relance:
    type: application
    platform: iOS
    sources: [Relance, Shared]
    configFiles:
      Debug: Relance/Resources/Secrets.xcconfig
      Release: Relance/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleSignIn
      - target: RelanceWidgets
      - target: RelanceWatch
      - target: RelanceShare
    entitlements:
      path: Relance/Resources/Relance.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
        # Choix de l'appareil qui relance, partagé entre l'iPhone, l'iPad et le Mac.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)fr.alexandrefau.relance
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
        # Le groupe propre de l'app d'abord (connexion Google existante), puis celui partagé avec l'extension.
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.alexandrefau.relance
          - $(AppIdentifierPrefix)fr.alexandrefau.relance.shared
    info:
      path: Relance/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        NSSupportsLiveActivities: true
        # Ancien nom et variantes : Siri reconnaît toujours « nouvelle Relance ».
        NSCalendarsFullAccessUsageDescription: Aiguillage ajoute à ton agenda les tâches que tu choisis, et met l'événement à jour quand l'heure de la tâche change.
        NSLocationWhenInUseUsageDescription: Aiguillage te prévient quand tu passes près du lieu d'une tâche que tu as choisie.
        NSLocationAlwaysAndWhenInUseUsageDescription: Pour te prévenir quand tu passes près du lieu d'une tâche, même quand Aiguillage est fermée. Ta position reste sur l'iPhone.
        INAlternativeAppNames:
          - INAlternativeAppName: Mes relances
          - INAlternativeAppName: Relance
          - INAlternativeAppName: Relances
        BGTaskSchedulerPermittedIdentifiers: [fr.alexandrefau.relance.refresh]
        GIDClientID: $(GOOGLE_CLIENT_ID)
        RelanceWebhookURL: $(RELANCE_WEBHOOK_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLName: fr.alexandrefau.relance
            CFBundleURLSchemes: [relance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RelanceMac:
    type: application
    platform: macOS
    # Le code partagé et les vues de tâche de l'iPad ; ni widgets, ni montre, ni activité en direct.
    sources:
      - RelanceMac
      - Shared/Model
      - Shared/Google
      - Shared/Reminders
      - Shared/Share
      - Relance/Google
      - Relance/App/CalendarLink.swift
      - Relance/App/TravelTimes.swift
      - Relance/App/PlaceLocator.swift
      - Relance/App/TriageRequest.swift
      - Relance/App/PushRegistration.swift
      - Relance/App/DemoData.swift
      - Relance/Views/PlatformCompat.swift
      - Relance/Views/CategoryViews.swift
      - Relance/Views/TagViews.swift
      - Relance/Views/PriorityViews.swift
      - Relance/Views/ContactSection.swift
      - Relance/Views/CalendarSection.swift
      - Relance/Views/TaskRemindersView.swift
      - Relance/Views/TriageViews.swift
      - Relance/Views/TaskFields.swift
      - Relance/Views/TaskRow.swift
      - Relance/Views/TaskDetailView.swift
      - Relance/Views/ReminderSettingsView.swift
      - Relance/Views/QuickAddSheet.swift
      - Relance/Views/ReminderDeviceSection.swift
      - Relance/Views/PlaceSearchView.swift
      - Relance/Views/MemoViews.swift
      - Relance/Views/TaskMapView.swift
      - Relance/Views/ToSeeViews.swift
      - Relance/Views/RecurrenceViews.swift
      - Relance/Views/TaskEditor.swift
    configFiles:
      Debug: Relance/Resources/Secrets.xcconfig
      Release: Relance/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleSignIn
    entitlements:
      path: RelanceMac/RelanceMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)fr.alexandrefau.relance
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
        keychain-access-groups: [$(AppIdentifierPrefix)fr.alexandrefau.relance]
    info:
      path: RelanceMac/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Aiguillage ajoute à ton agenda les tâches que tu choisis, et met l'événement à jour quand l'heure de la tâche change.
        GIDClientID: $(GOOGLE_CLIENT_ID)
        RelanceWebhookURL: $(RELANCE_WEBHOOK_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        # Même identifiant que l'app iOS : le client OAuth Google est lié à cet identifiant.
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance
        PRODUCT_NAME: Aiguillage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
  RelanceShare:
    type: app-extension
    platform: iOS
    sources:
      - RelanceShare
      - Shared/Share
      - Shared/Google
      - Shared/Model/MemoMerge.swift
      - Shared/Model/DateDetection.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Reminders/ReminderOverride.swift
      - Shared/Model/TaskTag.swift
    entitlements:
      path: RelanceShare/RelanceShare.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
        keychain-access-groups: [$(AppIdentifierPrefix)fr.alexandrefau.relance.shared]
    info:
      path: RelanceShare/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.share
  RelanceWidgets:
    type: app-extension
    platform: iOS
    sources: [RelanceWidgets, Shared]
    entitlements:
      path: RelanceWidgets/RelanceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  RelanceWatch:
    type: application
    platform: watchOS
    sources:
      - RelanceWatch
      - Shared/Watch
      - Shared/Model/DueText.swift
      - Shared/Model/DateDetection.swift
      - Shared/Reminders/ReminderPlanner.swift
      - Shared/Reminders/ReminderProfile.swift
      - Shared/Model/ToSee.swift
      - Shared/Reminders/ReminderOverride.swift
      - Shared/Google/TasksAPI.swift
      - Shared/Google/NotesTimeCodec.swift
      - Shared/Google/GoogleRefreshSession.swift
      - Shared/Intents/SiriCapture.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Model/TaskCategory.swift
      - Shared/Model/TaskTag.swift
      - Shared/Model/MemoMerge.swift
      - Shared/Google/MemoRemote.swift
      - Shared/WatchApp
    dependencies:
      - target: RelanceWatchWidgets
    entitlements:
      path: RelanceWatch/RelanceWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWatch/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        WKApplication: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.alexandrefau.relance.watch
            CFBundleURLSchemes: [relance]
        WKCompanionAppBundleIdentifier: fr.alexandrefau.relance
        INAlternativeAppNames:
          - INAlternativeAppName: Mes relances
          - INAlternativeAppName: Relance
          - INAlternativeAppName: Relances
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RelanceWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - RelanceWatchWidgets
      - Shared/Watch
      - Shared/WatchApp
      - Shared/Model/DueText.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Reminders/ReminderPlanner.swift
      - Shared/Reminders/ReminderProfile.swift
      - Shared/Model/ToSee.swift
      - Shared/Reminders/ReminderOverride.swift
    entitlements:
      path: RelanceWatchWidgets/RelanceWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aiguillage
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "16"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.watchkitapp.widgets
        SKIP_INSTALL: YES
  RelanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelanceTests]
    dependencies:
      - target: Relance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relance:
    build:
      targets:
        Relance: all
        RelanceWidgets: all
        RelanceTests: [test]
    test:
      targets: [RelanceTests]
  RelanceMac:
    build:
      targets:
        RelanceMac: all
  RelanceWatch:
    build:
      targets:
        RelanceWatch: all
