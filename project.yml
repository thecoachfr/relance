name: Relance
options:
  bundleIdPrefix: fr.alexandrefau
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: fr
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    DEVELOPMENT_TEAM: GD6W292ZXP
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Relance:
    type: application
    platform: iOS
    sources: [Relance, Shared]
    configFiles:
      Debug: Relance/Resources/Secrets.xcconfig
      Release: Relance/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleSignIn
      - target: RelanceWidgets
    entitlements:
      path: Relance/Resources/Relance.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: Relance/Resources/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        NSSupportsLiveActivities: true
        # « Relance » est un mot courant : on aide Siri à y reconnaître l'app.
        INAlternativeAppNames:
          - INAlternativeAppName: Mes relances
          - INAlternativeAppName: Relances
          - INAlternativeAppName: L'appli Relance
        BGTaskSchedulerPermittedIdentifiers: [fr.alexandrefau.relance.refresh]
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLName: fr.alexandrefau.relance
            CFBundleURLSchemes: [relance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RelanceWidgets:
    type: app-extension
    platform: iOS
    sources: [RelanceWidgets, Shared]
    entitlements:
      path: RelanceWidgets/RelanceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  RelanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelanceTests]
    dependencies:
      - target: Relance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relance:
    build:
      targets:
        Relance: all
        RelanceWidgets: all
        RelanceTests: [test]
    test:
      targets: [RelanceTests]
