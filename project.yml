name: Relance
options:
  bundleIdPrefix: fr.alexandrefau
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: fr
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    DEVELOPMENT_TEAM: GD6W292ZXP
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Relance:
    type: application
    platform: iOS
    sources: [Relance, Shared]
    configFiles:
      Debug: Relance/Resources/Secrets.xcconfig
      Release: Relance/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleSignIn
      - target: RelanceWidgets
      - target: RelanceWatch
      - target: RelanceShare
    entitlements:
      path: Relance/Resources/Relance.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
        # Le groupe propre de l'app d'abord (connexion Google existante), puis celui partagé avec l'extension.
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.alexandrefau.relance
          - $(AppIdentifierPrefix)fr.alexandrefau.relance.shared
    info:
      path: Relance/Resources/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        NSSupportsLiveActivities: true
        # « Relance » est un mot courant : on aide Siri à y reconnaître l'app.
        INAlternativeAppNames:
          - INAlternativeAppName: Mes relances
          - INAlternativeAppName: Relances
          - INAlternativeAppName: L'appli Relance
        BGTaskSchedulerPermittedIdentifiers: [fr.alexandrefau.relance.refresh]
        GIDClientID: $(GOOGLE_CLIENT_ID)
        RelanceWebhookURL: $(RELANCE_WEBHOOK_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLName: fr.alexandrefau.relance
            CFBundleURLSchemes: [relance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RelanceShare:
    type: app-extension
    platform: iOS
    sources:
      - RelanceShare
      - Shared/Share
      - Shared/Google
      - Shared/Model/DateDetection.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Reminders/ReminderOverride.swift
    entitlements:
      path: RelanceShare/RelanceShare.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
        keychain-access-groups: [$(AppIdentifierPrefix)fr.alexandrefau.relance.shared]
    info:
      path: RelanceShare/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.share
  RelanceWidgets:
    type: app-extension
    platform: iOS
    sources: [RelanceWidgets, Shared]
    entitlements:
      path: RelanceWidgets/RelanceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  RelanceWatch:
    type: application
    platform: watchOS
    sources:
      - RelanceWatch
      - Shared/Watch
      - Shared/Model/DueText.swift
      - Shared/Model/DateDetection.swift
      - Shared/Reminders/ReminderPlanner.swift
      - Shared/Reminders/ReminderProfile.swift
      - Shared/Reminders/ReminderOverride.swift
      - Shared/Google/TasksAPI.swift
      - Shared/Google/NotesTimeCodec.swift
      - Shared/Google/GoogleRefreshSession.swift
      - Shared/Intents/SiriCapture.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Model/TaskCategory.swift
    dependencies:
      - target: RelanceWatchWidgets
    entitlements:
      path: RelanceWatch/RelanceWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWatch/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        WKApplication: true
        WKCompanionAppBundleIdentifier: fr.alexandrefau.relance
        INAlternativeAppNames:
          - INAlternativeAppName: Mes relances
          - INAlternativeAppName: Relances
          - INAlternativeAppName: L'appli Relance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RelanceWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - RelanceWatchWidgets
      - Shared/Watch
      - Shared/Model/DueText.swift
      - Shared/Model/TaskPriority.swift
      - Shared/Reminders/ReminderPlanner.swift
      - Shared/Reminders/ReminderProfile.swift
      - Shared/Reminders/ReminderOverride.swift
    entitlements:
      path: RelanceWatchWidgets/RelanceWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.alexandrefau.relance]
    info:
      path: RelanceWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Relance
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.alexandrefau.relance.watchkitapp.widgets
        SKIP_INSTALL: YES
  RelanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelanceTests]
    dependencies:
      - target: Relance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relance:
    build:
      targets:
        Relance: all
        RelanceWidgets: all
        RelanceTests: [test]
    test:
      targets: [RelanceTests]
  RelanceWatch:
    build:
      targets:
        RelanceWatch: all
